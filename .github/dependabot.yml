# Abhängigkeits-Updates: pnpm-Workspace (ein Lockfile im Root, Pakete in den
# genannten Ordnern) und die GitHub Actions. Wöchentlich und gruppiert, damit
# nicht wieder Dutzende Einzel-PRs liegen bleiben.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/e2e"
      - "/smoke-test"
      - "/src/web"
      - "/src/api/sck-api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor/Patch zusammen in einem PR je Ordner; Major bleibt ein eigener PR.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
