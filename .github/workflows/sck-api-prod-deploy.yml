name: SCK-API Prod Deploy

# Produktiv-Deploy für sck-api — eigene Infra (5i1f4ng.de), LXC "sck-server"
# (CT 109), NICHT mehr der Alfahosting-Server von skiclub-kapfenburg.de (die
# alte SSH+systemd-Pipeline sck-api-build.yml/sck-api-deploy.yml ist seit
# Erstellung nie erfolgreich gelaufen, siehe infrastructure/README.md
# "Bekanntes Problem" - Architekturentscheidung: Umzug statt Debugging).
#
# Mechanismus wie test-deploy.yml/sck-admin-app-build-deploy.yml: Docker +
# self-hosted Runner statt SSH/SCP, weil das LXC keinen offenen eingehenden
# Port/öffentliche DNS für SSH hat - der Runner verbindet sich stattdessen
# ausgehend zu GitHub. `test`-Job bleibt auf einem GitHub-gehosteten Runner,
# `deploy` läuft nur bei Erfolg (`needs: test`) auf dem dedizierten Runner
# (Label "sck-server", einmalig eingerichtet, läuft als systemd-Service unter
# dem github-runner-User).
#
# sck-app bleibt bewusst auf Alfahosting (sck-web-app-build-deploy.yml,
# unverändert) - dieser Workflow deployt nur den api-Service aus
# docker-compose.yml, kein web/admin auf diesem LXC.

on:
  push:
    branches:
      - master
    paths:
      - "src/api/sck-api/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - ".github/workflows/sck-api-prod-deploy.yml"

# Deploys nacheinander: ein laufender endet, von den wartenden bleibt nur der neueste (der Deploy baut ohnehin den aktuellen master).
concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

env:
  APP_DIR: "/opt/sck-server"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting and tests
        run: |
          pnpm --filter sck-api run lint
          pnpm --filter sck-api run test

  deploy:
    needs: test
    runs-on: [self-hosted, sck-server]
    steps:
      - name: Deploy to sck-server LXC
        run: |
          set -e

          # /opt/sck-server muss dem github-runner-User gehören
          # (einmalig: chown -R github-runner:github-runner /opt/sck-server)
          git config --global --add safe.directory "${{ env.APP_DIR }}"

          if [ ! -d "${{ env.APP_DIR }}/.git" ]; then
            echo "📥 Cloning repository..."
            git clone ${{ github.server_url }}/${{ github.repository }}.git ${{ env.APP_DIR }}
          fi

          cd ${{ env.APP_DIR }}
          echo "🔄 Checking out master..."
          git fetch origin
          git checkout master
          git reset --hard origin/master

          echo "🔨 Building api image..."
          docker compose build api

          echo "🚀 Restarting api service..."
          docker compose up -d api

          echo "🧹 Pruning old images/build cache..."
          docker image prune -f
          docker builder prune -f

          sleep 3
          set -a; source .env 2>/dev/null || true; set +a
          echo "🩺 Health check (direkt auf dem LXC, am Reverse Proxy vorbei, Port ${API_PORT:-3000}):"
          echo "  api / ........... $(curl -s -o /dev/null -w '%{http_code}' http://localhost:${API_PORT:-3000}/)"

      - name: Install smoke-test dependencies
        run: |
          set -e
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          cd ${{ env.APP_DIR }}
          pnpm install --frozen-lockfile --filter prod-smoke-test

      # Kein --with-deps: die OS-Pakete (libnss3 etc.) muessen einmalig als
      # root installiert werden (sudo steht dem github-runner-User bewusst
      # nicht zur Verfuegung) - siehe Setup-Referenz im privaten Vault.
      # Dieser Schritt laedt nur noch das Browser-Binary selbst.
      - name: Install Playwright browser (falls noch nicht vorhanden)
        run: |
          cd ${{ env.APP_DIR }}/smoke-test
          pnpm exec playwright install chromium

      # Prueft mit einem echten Browser, dass die oeffentliche Produktivseite
      # tatsaechlich funktioniert - ein reiner curl-Health-Check (oben) kann
      # Browser-spezifische Bloecke (CORS, Private Network Access) nicht
      # erkennen, siehe #199/#200/#207 fuer den Vorfall, der diesen Schritt
      # ausgeloest hat. Laeuft bewusst auf demselben self-hosted Runner wie
      # der Deploy selbst, da der dieselbe lokale DNS-Aufloesung nutzt wie
      # Clients im Homelab-LAN.
      - name: Production smoke test (echter Browser gegen die Live-Seite)
        run: |
          cd ${{ env.APP_DIR }}/smoke-test
          pnpm test

      - name: Smoke-Test-Report hochladen (bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prod-smoke-test-report
          path: ${{ env.APP_DIR }}/smoke-test/playwright-report/
          retention-days: 7
