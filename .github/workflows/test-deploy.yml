name: Test-System Deploy

# Auto-deploys on every push to a release/** branch. workflow_dispatch still
# lets you deploy any other branch on demand (e.g. from the GitHub mobile
# app while away from home) - pick the branch/tag to deploy from the Actions
# tab, defaulting to master.
on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to deploy"
        required: true
        default: "master"

env:
  APP_DIR: "/opt/sck-test"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref to deploy
        id: ref
        run: echo "ref=${{ github.event.inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to test LXC
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SERVER_ADDRESS }}
          username: ${{ secrets.TEST_SSH_USER }}
          password: ${{ secrets.TEST_SSH_PASSWORD }}
          port: ${{ secrets.TEST_SSH_PORT || 22 }}
          script: |
            set -e

            if [ ! -d "${{ env.APP_DIR }}/.git" ]; then
              echo "📥 Cloning repository..."
              mkdir -p ${{ env.APP_DIR }}
              git clone ${{ github.server_url }}/${{ github.repository }}.git ${{ env.APP_DIR }}
            fi

            cd ${{ env.APP_DIR }}
            echo "🔄 Checking out ${{ steps.ref.outputs.ref }}..."
            git fetch origin
            git checkout ${{ steps.ref.outputs.ref }}
            git reset --hard origin/${{ steps.ref.outputs.ref }}

            echo "🔨 Building images..."
            docker compose build

            echo "🚀 Starting stack..."
            docker compose up -d

            echo "🧹 Pruning old images..."
            docker image prune -f

            sleep 5
            docker compose ps
