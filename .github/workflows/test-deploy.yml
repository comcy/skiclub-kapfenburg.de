name: Test-System Deploy

# Auto-deploys on every push to a release/** branch. workflow_dispatch still
# lets you deploy any other branch on demand (e.g. from the GitHub mobile
# app while away from home) - pick the branch/tag to deploy from the Actions
# tab, defaulting to master.
#
# Runs directly on the sck-test LXC via a self-hosted runner (label
# "sck-test") instead of SSHing in from a GitHub-hosted runner - the LXC has
# no open inbound port and no public DNS, so the runner connects outbound to
# GitHub instead. See infrastructure/TEST_DEPLOYMENT.md.
on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to deploy"
        required: true
        default: "master"

env:
  APP_DIR: "/opt/sck-test"

jobs:
  deploy:
    runs-on: [self-hosted, sck-test]
    steps:
      - name: Determine ref to deploy
        id: ref
        run: echo "ref=${{ github.event.inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to test LXC
        run: |
          set -e

          # /opt/sck-test was created as root by the original setup script;
          # the runner runs as github-runner. Reclaim ownership (idempotent,
          # safe to re-run) and tell git this cross-user directory is fine.
          sudo mkdir -p "${{ env.APP_DIR }}"
          sudo chown -R "$(id -u):$(id -g)" "${{ env.APP_DIR }}"
          git config --global --add safe.directory "${{ env.APP_DIR }}"

          if [ ! -d "${{ env.APP_DIR }}/.git" ]; then
            echo "📥 Cloning repository..."
            git clone ${{ github.server_url }}/${{ github.repository }}.git ${{ env.APP_DIR }}
          fi

          cd ${{ env.APP_DIR }}
          echo "🔄 Checking out ${{ steps.ref.outputs.ref }}..."
          git fetch origin
          git checkout ${{ steps.ref.outputs.ref }}
          git reset --hard origin/${{ steps.ref.outputs.ref }}

          echo "🔨 Building images..."
          docker compose build

          echo "🚀 Starting stack..."
          docker compose up -d

          echo "🧹 Pruning old images..."
          docker image prune -f

          sleep 5
          docker compose ps
