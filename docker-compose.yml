services:
  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        COURSE_SHEET_URL: ${COURSE_SHEET_URL}
        TRIP_SHEET_URL: ${TRIP_SHEET_URL}
        SCK_API_URL: ${SCK_API_URL}
        # Set automatically by GitHub Actions when the self-hosted runner
        # builds this - blank for a manual `docker compose build` outside CI.
        BUILD_NUMBER: ${GITHUB_RUN_NUMBER}
        # Computed by test-deploy.yml before this build runs (.git isn't in
        # the Docker build context, see .dockerignore) - blank for a manual
        # `docker compose build` run without exporting it yourself first.
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH}
    restart: unless-stopped
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80']
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: src/api/sck-api/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SENDER_MAIL: ${SENDER_MAIL}
      SENDER_PW: ${SENDER_PW}
      # Required by the online membership registration form (field-level
      # IBAN encryption) — see .env.example.
      SEPA_ENCRYPTION_KEY: ${SEPA_ENCRYPTION_KEY}
      # Admin-app auth: this email gets full access on first login, no
      # invite needed — set it to your own address. Blank means nobody can
      # bootstrap into the admin app at all.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      # Base URL embedded in the magic-link login mail — must be wherever
      # the "admin" service below is actually reachable from your browser
      # (e.g. http://<LXC-IP>:8081), not the container-internal address.
      ADMIN_APP_URL: ${ADMIN_APP_URL}
      # Google login for the admin app — optional, magic-link works without
      # it. All three blank disables the "Sign in with Google" button's
      # backend route (it 500s instead of completing). See .env.example.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    volumes:
      - sck-api-data:/app/data
    healthcheck:
      # No GET route exists at "/" (sck-api only mounts POST routes under
      # /api/*), so this checks for any HTTP response rather than a 2xx —
      # wget/curl treat a 404 as failure, node's http.get doesn't.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: src/web/projects/sck-admin-app/Dockerfile
      args:
        SCK_API_URL: ${SCK_API_URL}
    restart: unless-stopped
    ports:
      - '8081:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sck-api-data:
