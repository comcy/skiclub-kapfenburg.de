# nginx equivalent of the Apache .htaccess used in production
# (projects/sck-app/src/.htaccess): serve real files/directories as-is,
# fall back to index.html for everything else so Angular's router handles
# client-side routes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
