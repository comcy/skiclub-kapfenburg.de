<shared-lib-site-header [title]="title" [color]="undefined"></shared-lib-site-header>

@if (navLinks.length) {
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="no-print">
        @for (link of navLinks; track link) {
            <a mat-tab-link [routerLink]="link.link" routerLinkActive #rla="routerLinkActive" [active]="rla.isActive">
                {{ link.label }}
            </a>
        }
    </nav>
}

<div class="content-area">
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
