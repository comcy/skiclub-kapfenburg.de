<div class="page">
    <app-page-heading title="Kurse"></app-page-heading>

    <div class="page-content">
        <table class="overview-table">
            <thead>
                <tr>
                    <th>Kurs</th>
                    <th>Anmeldungen</th>
                    <th style="width: 180px"></th>
                </tr>
            </thead>
            <tbody>
                @for (row of rows; track row.tile.id + (row.sport ?? '')) {
                    <tr class="row" [class.row-expired]="row.tile.expired">
                        <td>
                            {{ row.tile.title }}
                            @if (row.sport) {
                                <span class="sport-tag">{{ row.sport }}</span>
                            }
                            @if (row.newCount) {
                                <span class="badge-new">{{ row.newCount }} neu</span>
                            }
                        </td>
                        <td>{{ row.count }}</td>
                        <td class="actions-cell">
                            <a
                                mat-stroked-button
                                [routerLink]="['/registrations', 'kurse', row.tile.id]"
                                [queryParams]="row.sport ? { sport: row.sport } : {}"
                            >
                                <mat-icon>how_to_reg</mat-icon>
                                <span class="btn-label">Anmeldungen</span>
                            </a>
                        </td>
                    </tr>
                }
                @if (loaded && !rows.length) {
                    <tr>
                        <td colspan="3" class="empty">Noch keine Kurse angelegt.</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
