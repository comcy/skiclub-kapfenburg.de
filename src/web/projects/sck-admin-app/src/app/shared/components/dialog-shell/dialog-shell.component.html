<div class="dialog-shell-header">
    <h2 mat-dialog-title class="dialog-shell-title">{{ title }}</h2>
    <button mat-icon-button (click)="onClose()" aria-label="Schließen">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-shell-content">
    <ng-content></ng-content>
</mat-dialog-content>

<div mat-dialog-actions align="end" class="dialog-shell-actions">
    <ng-content select="[dialogActions]"></ng-content>
</div>
