@if (auth.session(); as session) {
    <div class="user-bar">
        <span>{{ session.email }}</span>
        <button mat-button (click)="logout()">
            <mat-icon>logout</mat-icon>
            Logout
        </button>
    </div>
}

<div id="navigation">
    <shared-lib-site-navigation [title]="title" [navItems]="navItems"></shared-lib-site-navigation>
</div>

<div class="content">
    <router-outlet></router-outlet>
</div>
