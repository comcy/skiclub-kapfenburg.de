<mat-toolbar color="primary" class="top-bar">
    <img src="assets/logos/ski-logo.svg" alt="SCK" class="logo" />
    <span class="title">{{ title }}</span>
    <span class="spacer"></span>
    @if (auth.session(); as session) {
        <span class="user-email">{{ session.email }}</span>
        <button mat-button (click)="logout()">
            <mat-icon>logout</mat-icon>
            Logout
        </button>
    }
</mat-toolbar>

<div class="body">
    @if (auth.session()) {
        <nav class="side-nav" [class.collapsed]="!navExpanded">
            <div class="nav-items">
                @for (item of navItems; track item.route) {
                    <a
                        class="nav-item"
                        [routerLink]="item.route"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: false }"
                        [matTooltip]="navExpanded ? '' : item.name"
                        matTooltipPosition="right"
                    >
                        <mat-icon>{{ item.icon }}</mat-icon>
                        <span class="nav-label">{{ item.name }}</span>
                    </a>
                }
            </div>
            <button
                mat-icon-button
                class="collapse-toggle"
                (click)="toggleNav()"
                [attr.aria-label]="navExpanded ? 'Navigation einklappen' : 'Navigation ausklappen'"
            >
                <mat-icon>{{ navExpanded ? 'chevron_left' : 'chevron_right' }}</mat-icon>
            </button>
        </nav>
    }

    <div class="content">
        <router-outlet></router-outlet>
    </div>
</div>
