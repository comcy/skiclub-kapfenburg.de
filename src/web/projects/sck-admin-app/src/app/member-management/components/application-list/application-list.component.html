<div class="header">
    <h2>Eingereichte Anträge</h2>
</div>

@if (applications$ | async; as applications) {
    @if (applications.length) {
        <table mat-table [dataSource]="applications" class="mat-elevation-z8">
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let application">{{ application.firstName }} {{ application.lastName }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>E-Mail</th>
                <td mat-cell *matCellDef="let application">{{ application.email }}</td>
            </ng-container>

            <ng-container matColumnDef="submittedAt">
                <th mat-header-cell *matHeaderCellDef>Eingereicht am</th>
                <td mat-cell *matCellDef="let application">{{ application.timestamp | date: 'shortDate' }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let application">
                    <button mat-raised-button color="primary" (click)="onPromote(application)">
                        <mat-icon>person_add</mat-icon>
                        Als Mitglied übernehmen
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    } @else {
        <p class="empty">Keine offenen Anträge.</p>
    }
}
