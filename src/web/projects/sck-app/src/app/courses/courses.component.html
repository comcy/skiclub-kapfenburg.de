<shared-lib-site-header [title]="title" [color]="color"></shared-lib-site-header>

<nav class="courses-lib-tab-navigation" mat-tab-nav-bar [tabPanel]="tabPanel">
    @for (link of navLinks; track link) {
        <a mat-tab-link [routerLink]="link.link" routerLinkActive #rla="routerLinkActive" [active]="rla.isActive">
            {{ link.label }}
        </a>
    }
</nav>
<div class="tab-content">
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
