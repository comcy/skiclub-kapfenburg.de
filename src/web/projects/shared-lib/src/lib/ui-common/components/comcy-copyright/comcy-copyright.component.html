<div class="copyright-container">
    <p>
        <span>{{ getVersionOrBuildNumber() }}</span>
        @if (getFormattedBuildDate(); as buildDateLabel) {
            <span>{{ buildDateLabel }}</span>
        }
        <span>&copy; {{ getYear() }}</span>
        <a href="{{ link }}"
            ><i>{{ name }}</i></a
        >
    </p>
</div>
