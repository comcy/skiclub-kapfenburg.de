<header>
    <div id="logo">
        <a href="#">
            <img width="130" alt="Logo" src="../../../../assets/img/burg.svg" />
        </a>
    </div>

    <nav id="main-nav">
        <ul>
            @for (n of navItems; track n) {
                <li>
                    <a href="{{ n.route }}" (click)="routeTo(n.route)">{{ n.name }}</a>
                </li>
            }
        </ul>
    </nav>
</header>
