<div class="game-wrapper">
    <h2>⛷️ Skiclub Downhill</h2>

    <div class="game" #gameArea>
        <div class="player" [style.left.px]="playerX"></div>

        @for (tree of trees; track tree) {
            <div class="tree" [style.top.px]="tree.y" [style.left.px]="tree.x"></div>
        }

        <div class="score">Punkte: {{ score }}</div>

        @if (gameOver) {
            <div class="game-over">
                <h3>💥 Sturz!</h3>
                <p>Punkte: {{ score }}</p>
                <button (click)="restart()">Neu starten</button>
            </div>
        }
    </div>

    <div class="controls">
        <button (click)="move(-40)">◀</button>
        <button (click)="move(40)">▶</button>
    </div>
</div>
