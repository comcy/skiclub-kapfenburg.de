<shared-lib-site-header [title]="tile ? tile.title : 'Kurs'"></shared-lib-site-header>

@if (tile) {
    <div class="detail-image-wrap">
        <img class="detail-image" src="{{ tile.image }}" alt="{{ tile.imageDescription }}" />
        @if (tile.status === tileStatusEnum.Canceled) {
            <span class="canceled-stamp">Abgesagt</span>
        }
    </div>
}

<div class="content-container" [class.overlaps-image]="tile">
    @if (tile) {
        <a class="back-link" routerLink="/home">&larr; Zurück zur Übersicht</a>

        <div class="detail-meta">
            <span class="detail-date">{{ tile.date }}</span>
            @if (tile.subTitle) {
                <span class="detail-subtitle">{{ tile.subTitle }}</span>
            }
        </div>

        <div class="detail-body">
            <div [innerHTML]="markdown.render(tile.description)"></div>
            @if (tile.details) {
                <div [innerHTML]="markdown.render(tile.details)"></div>
            }
        </div>

        <section class="registration-section">
            <button
                mat-fab
                extended
                color="primary"
                class="registration-toggle"
                (click)="registrationOpen = !registrationOpen"
            >
                <mat-icon>event_note</mat-icon>
                {{ registrationOpen ? 'Anmeldeformular schließen' : 'Jetzt anmelden' }}
                <mat-icon>{{ registrationOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
            </button>

            @if (registrationOpen) {
                <div class="registration-form-wrap">
                    <lib-gym-courses-registration-form
                        [additionalData]="registrationData"
                    ></lib-gym-courses-registration-form>
                </div>
            }
        </section>
    } @else {
        <p class="not-found">Dieser Kurs wurde nicht gefunden.</p>
        <a routerLink="/home">Zurück zur Startseite</a>
    }
</div>
