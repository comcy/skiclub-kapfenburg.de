@if (tripDetails$ | async; as trips) {
    <lib-base-dialog [title]="dialogTitle" [date]="tripDate" [registerForm]="true">
        <lib-trips-registration-form
            registerForm
            [additionalData]="trips"
            (submitForm)="onTripRegistrationFormSubmit($event)"
        >
        </lib-trips-registration-form>
    </lib-base-dialog>
}
